<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Milan Paudel for software engineering, embedded hardware projects, and collaborations.">
    <title>Contact | Milan Paudel</title>
    
    <!-- Icons & Styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="container nav-container">
            <a href="index.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
            </a>
            <a href="index.html" class="logo"><i class="fa-solid fa-code"></i> Milan Paudel</a>
        </div>
    </nav>

    <main class="container">
        <!-- Contact Form Section -->
        <section class="contact-section">
            <h2 class="section-title">Get in Touch</h2>
            <div class="contact-card">
                <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">
                    <input type="hidden" name="access_key" value="68a2876a-e34a-4932-ac6f-19f8cb011b70">
                    <input type="hidden" name="redirect" value="false">
                    
                    <div class="form-group">
                        <label for="name">Name*</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" name="email" required 
                               pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="john@example.com">
                        <div class="error-text" id="emailError" style="display: none;">Please enter a valid email address.</div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone*</label>
                        <input type="tel" id="phone" name="phone" required
                               pattern="^(\+?\d{1,3}[- ]?)?\d{7,11}$" placeholder="+1234567890">
                        <div class="error-text" id="phoneError" style="display: none;">Please enter a valid phone number (7 to 11 digits).</div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message*</label>
                        <textarea id="message" name="message" required placeholder="Type your message here..."></textarea>
                        <div class="error-text" id="messageError" style="display: none;">Inappropriate words are not permitted. Please revise.</div>
                    </div>

                    <button type="submit" class="btn-submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Milan Paudel. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
